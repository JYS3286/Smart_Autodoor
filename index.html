<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Cafe</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    background:
      radial-gradient(circle at center, #f2eee6 0%, #e5e0d6 45%, #d8d4cc 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cafe-wrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cafe-facade {
    position: relative;
    width: min(1120px, 94vw);
    height: min(600px, 86vh);
    background: #f3efe5;
    border-radius: 34px;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.9);
    box-shadow:
      0 30px 70px rgba(80, 70, 60, 0.22),
      inset 0 0 0 1px rgba(255,255,255,0.7);
    display: grid;
    grid-template-columns: 1fr 1.85fr 1fr;
    grid-template-rows: 145px 1fr;
  }

  .cafe-facade::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to right,
        transparent 0%,
        transparent 27.7%,
        rgba(185,178,165,0.45) 27.8%,
        transparent 28%,
        transparent 72%,
        rgba(185,178,165,0.45) 72.2%,
        transparent 72.4%),
      linear-gradient(to bottom,
        transparent 0%,
        transparent 30%,
        rgba(185,178,165,0.45) 30.2%,
        transparent 30.5%);
    pointer-events: none;
    z-index: 3;
  }

  .top-panel {
    position: relative;
    background: #eee9df;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
  }

  .soft-card {
    width: 80%;
    height: 88px;
    border-radius: 18px;
    background: linear-gradient(145deg, #f7f5ef, #e3e0d8);
    box-shadow:
      10px 12px 22px rgba(90, 80, 70, 0.18),
      -8px -8px 20px rgba(255,255,255,0.9),
      inset 1px 1px 1px rgba(255,255,255,0.8);
  }

  .sign {
    width: 82%;
    height: 88px;
    border-radius: 18px;
    background: linear-gradient(145deg, #f8f4ec, #e8e3d8);
    box-shadow:
      10px 12px 24px rgba(90, 80, 70, 0.18),
      -8px -8px 20px rgba(255,255,255,0.9),
      inset 1px 1px 1px rgba(255,255,255,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    font-size: clamp(30px, 4vw, 48px);
    font-weight: 300;
    letter-spacing: 2px;
    color: #46444a;
    z-index: 5;
  }

  .sign-icon {
    font-size: clamp(26px, 3.2vw, 40px);
    color: #766382;
  }

  .side-area {
    position: relative;
    background: linear-gradient(180deg, #f3eee4, #eee7d8);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .window-card {
    position: relative;
    width: 72%;
    height: 74%;
    border-radius: 28px;
    background: linear-gradient(145deg, #f9f5ec, #e7e1d5);
    box-shadow:
      12px 16px 28px rgba(90, 80, 70, 0.18),
      -8px -8px 22px rgba(255,255,255,0.9),
      inset 1px 1px 1px rgba(255,255,255,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .display-window {
    position: relative;
    width: 78%;
    height: 68%;
    border-radius: 22px;
    border: 10px solid rgba(245,245,240,0.95);
    overflow: hidden;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.35), transparent),
      linear-gradient(180deg, #c7b091, #8b7059);
    box-shadow:
      inset 0 0 22px rgba(0,0,0,0.2),
      0 10px 18px rgba(75,60,45,0.18);
  }

  .display-window::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(230, 220, 205, 0.22);
    backdrop-filter: blur(3px);
    z-index: 2;
  }

  .display-window::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 24% 34%, rgba(255,235,185,0.95) 0 5%, transparent 8%),
      radial-gradient(circle at 58% 36%, rgba(255,235,185,0.9) 0 5%, transparent 8%),
      radial-gradient(circle at 86% 45%, rgba(255,235,185,0.85) 0 4%, transparent 7%),
      linear-gradient(90deg, transparent 0 60%, rgba(55,40,35,0.28) 61% 70%, transparent 72%);
    filter: blur(2px);
    z-index: 1;
  }

  .window-purple-base {
    position: absolute;
    bottom: 13%;
    width: 58%;
    height: 34px;
    border-radius: 0 0 18px 18px;
    background: #7b6393;
    box-shadow: 0 10px 18px rgba(70,50,90,0.25);
    z-index: 0;
  }

  .right-decoration {
    position: absolute;
    right: 12%;
    bottom: 11%;
    width: 84px;
    height: 22px;
    border-radius: 20px;
    background: linear-gradient(90deg, #8d8298, #b8b0bf);
    box-shadow: 0 6px 12px rgba(80,70,90,0.22);
  }

  .right-decoration::after {
    content: "✦";
    position: absolute;
    left: 36px;
    top: -5px;
    color: rgba(255,255,255,0.65);
    font-size: 26px;
  }

  .center-area {
    position: relative;
    background: linear-gradient(180deg, #f5f1e9, #eee7dc);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 32px 0;
  }

  .door-frame-outer {
    position: relative;
    width: 94%;
    height: 92%;
    border-radius: 32px 32px 0 0;
    background: linear-gradient(145deg, #f8f6f0, #ddd8ce);
    box-shadow:
      0 18px 34px rgba(85,75,65,0.22),
      -8px -8px 22px rgba(255,255,255,0.85),
      inset 0 0 0 8px rgba(255,255,255,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 22px 0;
  }

  .door-arch {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 22px 22px 0 0;
    overflow: hidden;
    border: 2px solid rgba(120,115,105,0.45);
    background: #ebe5da;
    box-shadow:
      inset 0 0 16px rgba(0,0,0,0.16),
      inset 0 0 0 4px rgba(255,255,255,0.35);
  }

  .door-interior {
    position: absolute;
    inset: 0;
    z-index: 0;
    background:
      linear-gradient(180deg, rgba(250,238,215,0.95), rgba(216,186,150,0.9)),
      radial-gradient(circle at 48% 25%, rgba(255,235,190,0.9), transparent 32%);
    overflow: hidden;
  }

  .interior-scene {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .interior-wall-light {
    position: absolute;
    width: 120px;
    height: 120px;
    left: 42%;
    top: 24%;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(255,232,185,0.8), transparent 68%);
    border-radius: 50%;
  }

  .int-lamp {
    position: absolute;
    top: 10%;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff0c4;
    box-shadow: 0 0 18px rgba(255,230,170,0.9);
  }

  .int-lamp::before {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 100%;
    width: 1px;
    height: 80px;
    background: rgba(70,55,45,0.35);
  }

  .int-lamp.lp1 { left: 30%; }
  .int-lamp.lp2 { left: 63%; width: 24px; height: 24px; }
  .int-lamp.lp3 { left: 67%; top: 18%; width: 17px; height: 17px; }

  .int-counter {
    position: absolute;
    right: 9%;
    bottom: 0;
    width: 120px;
    height: 142px;
    background: linear-gradient(90deg, #b88d5e, #e1bd8d);
    border-radius: 52px 52px 0 0;
    box-shadow: -8px 0 20px rgba(75,55,35,0.18);
  }

  .int-counter::before {
    content: "";
    position: absolute;
    top: 18px;
    left: 28px;
    width: 70px;
    height: 12px;
    border-radius: 10px;
    background: rgba(255,255,255,0.45);
  }

  .int-plant {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 42px;
    height: 70px;
    background: #9b958c;
    border-radius: 0 0 18px 18px;
  }

  .int-plant::before {
    content: "";
    position: absolute;
    left: -24px;
    top: -92px;
    width: 90px;
    height: 110px;
    background:
      radial-gradient(ellipse at 40% 45%, #4d7d46 0 18%, transparent 20%),
      radial-gradient(ellipse at 65% 40%, #315f34 0 18%, transparent 20%),
      radial-gradient(ellipse at 55% 65%, #5f914f 0 20%, transparent 22%),
      radial-gradient(ellipse at 30% 68%, #3c6f3b 0 18%, transparent 20%);
  }

  .int-table {
    position: absolute;
    left: 18%;
    bottom: 26%;
    width: 88px;
    height: 8px;
    border-radius: 10px;
    background: #9c6f45;
  }

  .int-table::before,
  .int-table::after {
    content: "";
    position: absolute;
    top: -30px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #4d3426;
  }

  .int-table::before { left: 8px; }
  .int-table::after { right: 8px; }

  .door-panels {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    overflow: hidden;
  }

  .door-panel-left,
  .door-panel-right {
    width: 50%;
    height: 100%;
    position: relative;
    background:
      linear-gradient(90deg, rgba(255,255,255,0.25), rgba(180,205,215,0.25)),
      rgba(205,220,225,0.42);
    backdrop-filter: blur(3px);
    border: 5px solid rgba(230,235,232,0.95);
    transition: transform 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: white;
    text-shadow: 0 2px 5px rgba(0,0,0,0.25);
  }

  .door-panel-left {
    transform-origin: left center;
    border-right: 2px solid rgba(255,255,255,0.8);
  }

  .door-panel-right {
    transform-origin: right center;
    border-left: 2px solid rgba(255,255,255,0.8);
  }

  .door-panel-left.open {
    transform: translateX(-78%);
  }

  .door-panel-right.open {
    transform: translateX(78%);
  }

  .door-label {
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 1px;
  }

  .door-hours {
    margin-top: 8px;
    font-size: 7px;
    line-height: 1.6;
    opacity: 0.8;
    text-align: center;
  }

  .door-handle-left,
  .door-handle-right {
    position: absolute;
    top: 50%;
    width: 7px;
    height: 58px;
    border-radius: 10px;
    background: rgba(230,230,225,0.9);
    box-shadow: 0 2px 7px rgba(0,0,0,0.2);
  }

  .door-handle-left {
    right: 12px;
    transform: translateY(-50%);
  }

  .door-handle-right {
    left: 12px;
    transform: translateY(-50%);
  }

  .door-sensor {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: 72px;
    height: 12px;
    background: #2f3333;
    border-radius: 3px;
    z-index: 10;
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.25);
  }

  .floor-mat {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 48%;
    height: 22px;
    background: #6d6660;
    border-radius: 4px 4px 0 0;
    z-index: 8;
  }

  .door-status {
    position: absolute;
    top: 38px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 11px;
    letter-spacing: 2px;
    font-weight: 700;
    color: white;
    background: rgba(0,0,0,0.22);
    backdrop-filter: blur(4px);
  }

  #timer-display {
    position: absolute;
    top: 74px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.24);
    color: white;
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 600;
    z-index: 50;
    display: none;
  }

  #camera-panel {
    position: fixed;
    right: 22px;
    bottom: 22px;
    width: 180px;
    background: rgba(31, 29, 35, 0.9);
    border-radius: 18px;
    border: 1.5px solid rgba(255,255,255,0.18);
    overflow: hidden;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 8px;
    box-shadow: 0 18px 35px rgba(0,0,0,0.32);
    backdrop-filter: blur(8px);
  }

  #camera-panel canvas {
    width: 180px;
    height: 135px;
    display: block;
    border-radius: 16px 16px 0 0;
  }

  #camera-panel canvas#canvas {
    display: none;
  }

  #label-container {
    width: 100%;
    padding: 6px 10px 0;
  }

  #label-container div {
    font-size: 10px;
    color: rgba(255,255,255,0.88);
    padding: 2px 0;
    font-family: monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #manual-btn-wrap {
    position: fixed;
    right: 22px;
    bottom: 22px;
    display: none;
    z-index: 2000;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.9);
    padding: 14px;
    border-radius: 18px;
    box-shadow: 0 18px 35px rgba(0,0,0,0.18);
  }

  #manual-btn-wrap.visible {
    display: flex;
  }

  .manual-btn {
    width: 150px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 999px;
    border: 2px solid rgba(140,120,160,0.55);
    background: white;
    color: #7a6e85;
    cursor: pointer;
  }

  .manual-btn:hover {
    background: #f0eaf8;
  }

  .manual-btn-label {
    font-size: 11px;
    color: rgba(80,70,90,0.75);
    text-align: center;
  }

  @media (max-width: 760px) {
    .cafe-facade {
      width: 96vw;
      height: 72vh;
      grid-template-columns: 0.8fr 1.7fr 0.8fr;
      grid-template-rows: 105px 1fr;
    }

    .sign {
      height: 66px;
      font-size: 26px;
    }

    .soft-card {
      height: 66px;
    }

    .center-area {
      padding: 18px 14px 0;
    }

    .door-frame-outer {
      width: 98%;
      padding: 18px 14px 0;
    }

    #camera-panel {
      width: 145px;
      right: 12px;
      bottom: 12px;
    }

    #camera-panel canvas {
      width: 145px;
      height: 108px;
    }
  }
</style>
</head>

<body>
<div class="cafe-wrapper">
  <div class="cafe-facade">

    <div class="top-panel">
      <div class="soft-card"></div>
    </div>

    <div class="top-panel">
      <div class="sign">
        <span class="sign-icon">☕</span>
        <span>AURA CAFE</span>
      </div>
    </div>

    <div class="top-panel">
      <div class="soft-card"></div>
    </div>

    <div class="side-area">
      <div class="window-purple-base"></div>
      <div class="window-card">
        <div class="display-window"></div>
      </div>
    </div>

    <div class="center-area">
      <div class="door-frame-outer">
        <div class="door-arch" id="door-arch">

          <div class="door-interior">
            <div class="interior-scene">
              <div class="interior-wall-light"></div>
              <div class="int-lamp lp1"></div>
              <div class="int-lamp lp2"></div>
              <div class="int-lamp lp3"></div>
              <div class="int-table"></div>
              <div class="int-plant"></div>
              <div class="int-counter"></div>
            </div>
          </div>

          <div class="door-sensor"></div>

          <div class="door-panels" id="door-panels">
            <div class="door-panel-left" id="door-left">
              <span class="door-label">OPEN</span>
              <div class="door-hours">
                OPENING HOURS<br>
                MON-FRI 8:00 AM<br>
                SAT 9:00 PM
              </div>
              <div class="door-handle-left"></div>
            </div>

            <div class="door-panel-right" id="door-right">
              <span class="door-label">OPEN</span>
              <div class="door-handle-right"></div>
            </div>
          </div>

          <div class="floor-mat"></div>

          <div class="door-status" id="door-status">CLOSED</div>
          <div id="timer-display"></div>

        </div>
      </div>
    </div>

    <div class="side-area">
      <div class="window-purple-base"></div>
      <div class="window-card">
        <div class="display-window"></div>
      </div>
      <div class="right-decoration"></div>
    </div>

  </div>
</div>

<div id="camera-panel">
  <canvas id="cam-canvas" width="180" height="135"></canvas>
  <canvas id="canvas" width="200" height="200"></canvas>
  <div id="label-container"></div>
</div>

<div id="manual-btn-wrap">
  <div class="manual-btn-label">카메라 연결 안됨 — 수동 조작</div>
  <button class="manual-btn" onclick="manualOpen(5)">OPEN 5sec</button>
  <button class="manual-btn" onclick="manualOpen(10)">OPEN 10sec</button>
  <button class="manual-btn" onclick="manualClose()">CLOSE</button>
</div>

<script>
  const MODEL_URL = "https://teachablemachine.withgoogle.com/models/miCZxzxgA/";
  let model, webcam, ctx, camCtx, labelContainer, maxPredictions;

  let doorIsOpen = false;
  let closeTimer = null;
  let timerInterval = null;

  let sustainedPoseName = null;
  let sustainedPoseStart = null;

  let cameraFailed = false;
  let currentPredictions = [];

  const doorLeft = document.getElementById('door-left');
  const doorRight = document.getElementById('door-right');
  const doorStatus = document.getElementById('door-status');
  const timerDisplay = document.getElementById('timer-display');
  const manualBtnWrap = document.getElementById('manual-btn-wrap');
  const camCanvas = document.getElementById('cam-canvas');

  camCtx = camCanvas.getContext('2d');

  function openDoor(durationSec) {
    if (doorIsOpen) return;

    if (closeTimer) {
      clearTimeout(closeTimer);
      closeTimer = null;
    }

    doorLeft.classList.add('open');
    doorRight.classList.add('open');
    doorIsOpen = true;

    doorStatus.textContent = 'OPEN';
    doorStatus.style.background = 'rgba(60,140,80,0.55)';

    showTimer(durationSec);

    closeTimer = setTimeout(() => {
      closeDoor();
    }, durationSec * 1000);
  }

  function closeDoor() {
    doorLeft.classList.remove('open');
    doorRight.classList.remove('open');
    doorIsOpen = false;

    doorStatus.textContent = 'CLOSED';
    doorStatus.style.background = 'rgba(0,0,0,0.22)';

    if (closeTimer) {
      clearTimeout(closeTimer);
      closeTimer = null;
    }

    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    timerDisplay.style.display = 'none';

    sustainedPoseName = null;
    sustainedPoseStart = null;
  }

  function showTimer(sec) {
    let remaining = sec;

    timerDisplay.style.display = 'block';
    timerDisplay.textContent = `닫힘까지 ${remaining}s`;

    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    timerInterval = setInterval(() => {
      remaining--;

      if (remaining <= 0) {
        clearInterval(timerInterval);
        timerInterval = null;
        timerDisplay.style.display = 'none';
      } else {
        timerDisplay.textContent = `닫힘까지 ${remaining}s`;
      }
    }, 1000);
  }

  function manualOpen(sec) {
    openDoor(sec);
  }

  function manualClose() {
    closeDoor();
  }

  async function init() {
    try {
      const modelURL = MODEL_URL + "model.json";
      const metadataURL = MODEL_URL + "metadata.json";

      model = await tmPose.load(modelURL, metadataURL);
      maxPredictions = model.getTotalClasses();

      const flip = true;
      webcam = new tmPose.Webcam(200, 200, flip);

      await webcam.setup();
      await webcam.play();

      labelContainer = document.getElementById("label-container");

      for (let i = 0; i < maxPredictions; i++) {
        labelContainer.appendChild(document.createElement("div"));
      }

      window.requestAnimationFrame(loop);
      cameraFailed = false;

    } catch(e) {
      console.warn("Camera/model init failed:", e);

      cameraFailed = true;
      document.getElementById('camera-panel').style.display = 'none';
      manualBtnWrap.classList.add('visible');
    }
  }

  async function loop() {
    webcam.update();
    await predict();
    window.requestAnimationFrame(loop);
  }

  async function predict() {
    const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
    const prediction = await model.predict(posenetOutput);

    currentPredictions = prediction;

    for (let i = 0; i < maxPredictions; i++) {
      const cp = prediction[i].className + ": " + prediction[i].probability.toFixed(2);
      labelContainer.childNodes[i].innerHTML = cp;
    }

    drawCam(pose);
    handlePredictions(prediction);
  }

  function drawCam(pose) {
    if (webcam.canvas) {
      camCtx.drawImage(webcam.canvas, 0, 0, 180, 135);

      if (pose) {
        const minConf = 0.5;
        const scaleX = 180 / 200;
        const scaleY = 135 / 200;

        pose.keypoints.forEach(kp => {
          if (kp.score >= minConf) {
            camCtx.beginPath();
            camCtx.arc(kp.position.x * scaleX, kp.position.y * scaleY, 3, 0, 2 * Math.PI);
            camCtx.fillStyle = '#00ff88';
            camCtx.fill();
          }
        });
      }
    }
  }

  function getClassProb(prediction, name) {
    for (let p of prediction) {
      if (p.className.toLowerCase().includes(name.toLowerCase())) {
        return p.probability;
      }
    }
    return 0;
  }

  function getDetectedPose(prediction) {
    const THRESHOLD = 0.70;

    const open5 = getClassProb(prediction, 'OPEN 5sec');
    const open10 = getClassProb(prediction, 'OPEN 10sec');
    const close = getClassProb(prediction, 'close');

    const poses = [
      { name: 'open5', duration: 5, probability: open5 },
      { name: 'open10', duration: 10, probability: open10 },
      { name: 'close', duration: 0, probability: close }
    ];

    poses.sort((a, b) => b.probability - a.probability);

    if (poses[0].probability >= THRESHOLD) {
      return poses[0];
    }

    return null;
  }

  function handlePredictions(prediction) {
    const SUSTAIN_MS = 1000;
    const detectedPose = getDetectedPose(prediction);

    if (doorIsOpen) {
      sustainedPoseName = null;
      sustainedPoseStart = null;
      return;
    }

    if (!detectedPose) {
      sustainedPoseName = null;
      sustainedPoseStart = null;
      return;
    }

    if (sustainedPoseName !== detectedPose.name) {
      sustainedPoseName = detectedPose.name;
      sustainedPoseStart = Date.now();
      return;
    }

    const elapsed = Date.now() - sustainedPoseStart;

    if (elapsed < SUSTAIN_MS) {
      return;
    }

    if (detectedPose.name === 'open5') {
      openDoor(5);
    } else if (detectedPose.name === 'open10') {
      openDoor(10);
    } else if (detectedPose.name === 'close') {
      closeDoor();
    }

    sustainedPoseName = null;
    sustainedPoseStart = null;
  }

  init();
</script>
